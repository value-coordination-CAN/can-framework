site_name: Contribution–Access Network (CAN)
site_description: Open coordination infrastructure for post-monetary systems
site_url: https://value-coordination-can.github.io/can-framework/

repo_name: can-framework
repo_url: https://github.com/value-coordination-CAN/can-framework

exclude_docs: |
  README.md

docs_dir: docs
use_directory_urls: true

nav:
  - Home: index.md
  - Publications:
      - WP-001: publications/wp-001-network-value.md
      - WP-002: publications/wp-002-practical-post-money-allocation.md
      - WP-003: publications/wp-003-gaming-coordination.md
      - WP-004: publications/wp-004-moving-beyond-money.md
      - WP-005: publications/wp-005-six-degree-network-ledger.md
      - WP-006: publications/wp-006-operationalising-graph-settlement.md
      - WP-007: publications/wp-007-hybrid-integration-payment-rails.md
      - WP-008: publications/wp-008-value-discovery-knowledge-vector.md
      - WP-009: publications/wp-009-when-growth-cannot-compensate.md
      - WP-010: publications/wp-010-bridge-wallet-participation-funding.md
      - WP-011: publications/wp-011-value-assurance-future-proofing.md
      - WP-012: publications/wp-012-value-map-discovery.md
  - Implementations:
      - Agent Integration API: implementation/agent-integration-api.md
      - Working API (value, search, exchange): implementation/agent-work-api.md
      - Value Map API (needs, capacities, discovery): implementation/value-map-api.md
      - WP-010 Bridge Wallet: implementation/wp-010-bridge-wallet.md
      - WP-011 Value Assurance: implementation/wp-011-value-assurance.md

  - Policy:
      - Overview: about/POLICY_ABOUT.md
      - Regulators: about/FOR_REGULATORS.md
      - Safeguards in Code: about/SAFEGUARDS_IN_CODE.md
      - AI and Agent Participation: about/ai-and-agents-participation.md
      - A Note from an AI Contributor: about/a-note-from-an-ai-contributor.md
      - Universities: about/FOR_UNIVERSITIES_AND_RESEARCH.md
      - Developers: about/FOR_DEVELOPERS.md
  - Integrations:
      - Overview: integrations/index.md
      - Integration Policy: integrations/INTEGRATION_POLICY.md
      - Backend: https://github.com/value-coordination-CAN/can-framework/blob/main/backend/README.md
  - Governance:
      - Governance: https://github.com/value-coordination-CAN/can-framework/blob/main/GOVERNANCE.md
      - Contributing: https://github.com/value-coordination-CAN/can-framework/blob/main/CONTRIBUTING.md
      - Security: https://github.com/value-coordination-CAN/can-framework/blob/main/SECURITY.md
      - Releases: https://github.com/value-coordination-CAN/can-framework/blob/main/RELEASE.md

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition

plugins:
  - search

theme:
  name: material